# Hide the DisplayLink dock's audio card so docking never steals the default
# output/input from the laptop (or the Zoom P4). WirePlumber ranks any device
# that was ever picked as default above plain priority, so lowering the dock's
# priority is not enough once it has been chosen once; disabling the card is.
# To use the dock's headphone jack again, remove this file and restart
# wireplumber (systemctl --user restart wireplumber).
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-DisplayLink_.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
