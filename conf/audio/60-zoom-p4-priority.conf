# Prefer the Zoom P4 over internal/dock audio whenever it is present.
# Wildcard match covers the suffixed node names (…iec958-stereo.2 etc.) that
# appear when the dock re-enumerates the device before the old node is gone.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output\.usb-ZOOM_Corporation_ZOOM_P4_Audio.*" }
    ]
    actions = {
      update-props = {
        priority.session = 3000
        priority.driver  = 3000
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input\.usb-ZOOM_Corporation_ZOOM_P4_Audio.*" }
    ]
    actions = {
      update-props = {
        priority.session = 3000
        priority.driver  = 3000
      }
    }
  }
]
