# NM wifi backend. wpa_supplicant (2026-08-14): iwd 2.14 + mt7921e fails
# WPA3-SAE against transition-mode APs (status 77 + 4-way timeout, e.g.
# STC-Member1, iPhone hotspot) and breaks scan results in applets.
# History: iwd was chosen 2026-05 for dropped packets on 9Zero wifi with
# wpa_supplicant — if that recurs, tune powersave before switching back.
[device]
wifi.backend=wpa_supplicant
